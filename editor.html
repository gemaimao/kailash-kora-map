<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>路线编辑器 (3D) · 冈仁波齐转山</title>
  <!-- CesiumJS -->
  <script src="https://npm.elemecdn.com/cesium@1.107.0/Build/Cesium/Cesium.js"></script>
  <link href="https://npm.elemecdn.com/cesium@1.107.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/cesium-navigation-es6-plugin@1.1.7/CesiumNavigation.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: -apple-system, "PingFang SC", sans-serif; background: #0d0d0f; color: #eee; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 0; background: #0d0d0f; }

    .cesium-viewer-bottom { display: none !important; }

    .toolbar {
      position: absolute; z-index: 1000; top: 12px; left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: rgba(18,18,22,0.92); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      padding: 10px 14px;
    }
    .toolbar button {
      background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
      white-space: nowrap; transition: background-color 0.2s;
    }
    .toolbar button:hover { background: rgba(255,255,255,0.2); }
    .toolbar button.active { background: rgba(255,205,85,0.3); border-color: #ffcd55; color: #ffcd55; }
    .toolbar button.danger { border-color: rgba(255,80,80,0.4); background: rgba(255,80,80,0.1); color: #ff8080; }
    .toolbar button.danger:hover { background: rgba(255,80,80,0.2); }
    .toolbar select {
      background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none;
    }
    .toolbar .sep { width: 1px; height: 24px; background: rgba(255,255,255,0.15); }
    .toolbar .info { font-size: 12px; color: rgba(255,255,255,0.6); }

    .status-bar {
      position: absolute; z-index: 1000; bottom: 12px; left: 12px; right: 12px;
      background: rgba(18,18,22,0.88); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      padding: 10px 14px; font-size: 12px; color: rgba(255,255,255,0.6);
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }

    .crosshair { cursor: crosshair !important; }

    /* Floating Node Panel */
    .node-panel {
      position: absolute; z-index: 1000; top: 74px; right: 12px;
      width: 260px; background: rgba(18,18,22,0.95); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,205,85,0.3); border-radius: 8px;
      padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: none; flex-direction: column; gap: 10px;
    }
    .node-panel h3 { font-size: 13px; color: #ffcd55; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; margin-bottom: 4px; }
    .node-panel .field { display: flex; flex-direction: column; gap: 4px; }
    .node-panel label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; }
    .node-panel input {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px; padding: 6px; color: #fff; font-size: 12px; outline: none;
    }
    .node-panel input:focus { border-color: #ffcd55; }
    .node-panel .actions { display: flex; gap: 8px; margin-top: 4px; }
    .node-panel button {
      flex: 1; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; font-weight: 600;
    }
    .node-panel button.danger { background: rgba(255,80,80,0.2); border: 1px solid rgba(255,80,80,0.4); color: #ff8080; }
    .node-panel button.danger:hover { background: rgba(255,80,80,0.3); }
    .node-panel button.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
    .node-panel button.secondary:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div id="map" class="crosshair"></div>

  <div class="toolbar">
    <select id="routeSelect">
      <option value="main">主线（全线）</option>
      <option value="s0">支线：大天葬台路线</option>
      <option value="s1">支线：曲古寺之路</option>
      <option value="s2">支线：哲日浦寺之路</option>
      <option value="s3">支线：空行母之路</option>
    </select>
    <div class="sep"></div>
    <button id="undoBtn">↩ 撤销</button>
    <button id="clearBtn" class="danger">✕ 清空当前线</button>
    <div class="sep"></div>
    <button id="refToggle" class="active">👁 旧路线参考</button>
    <div class="sep"></div>
    <button id="saveBtn" style="background:rgba(80,180,80,0.2); border-color:rgba(80,180,80,0.4); color: #8af;">💾 保存到服务器</button>
    <button id="exportBtn">↓ 导出 JSON</button>
    <span class="info" id="pointCount">0 个点</span>
  </div>

  <div class="node-panel" id="nodePanel">
    <h3 id="panelTitle">选中节点 #1</h3>
    <div class="field">
      <label>经度 (Longitude)</label>
      <input type="number" id="nodeLng" step="0.000001">
    </div>
    <div class="field">
      <label>纬度 (Latitude)</label>
      <input type="number" id="nodeLat" step="0.000001">
    </div>
    <div class="actions">
      <button class="danger" id="delNodeBtn">删除此点</button>
      <button class="secondary" id="closePanelBtn">关闭</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText">正在初始化 3D 地形...</span>
    <span id="coordDisplay">—</span>
  </div>

  <script>
    // Cesium Access Token
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJhZDY0YWY3Yy1mZmQ1LTQ2MjgtYTRjZi01OTM0NzQ3YjljOGMiLCJpZCI6NDM2NzA2LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzk4MDU4MjZ9.80efk41binldWGgit3mGqqZ3keritykzZUoNw0qoQc0';

    // ---- State ----
    let routes = {
      main: [],
      secondary: [
        { name: "大天葬台路线", coords: [] },
        { name: "曲古寺之路", coords: [] },
        { name: "哲日浦寺之路", coords: [] },
        { name: "空行母之路", coords: [] }
      ]
    };

    let currentKey = "main";           // "main" | "s0" | "s1" | "s2" | "s3"
    let viewer;
    let editLineEntity = null;         // Polyline entity for the editing route
    let refLineEntities = [];          // Reference polyline entities (faint red)
    let dragMarkers = [];              // Array of drag handle entities
    let refVisible = true;
    let isDragging = false;
    let dragEntity = null;
    let selectedNodeIdx = null; // Currently selected route point index

    // ---- Helpers ----
    function getCurrentCoords() {
      if (currentKey === "main") return routes.main;
      const idx = parseInt(currentKey.slice(1));
      return routes.secondary[idx].coords;
    }

    function setCurrentCoords(arr) {
      if (currentKey === "main") routes.main = arr;
      else {
        const idx = parseInt(currentKey.slice(1));
        routes.secondary[idx].coords = arr;
      }
    }

    function updateCount() {
      document.getElementById("pointCount").textContent = getCurrentCoords().length + " 个点";
    }

    // ---- Init ----
    async function init() {
      const statusEl = document.getElementById("statusText");

      viewer = new Cesium.Viewer("map", {
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        fullscreenButton: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        selectionIndicator: true,
        sceneModePicker: false,
        navigationHelpButton: false
      });

      // Disable default double click zoom out
      viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

      // Initialize official Cesium Navigation plugin
      if (typeof CesiumNavigation !== 'undefined') {
        new CesiumNavigation(viewer, {
          defaultResetView: Cesium.Cartographic.fromDegrees(81.2865, 30.9300, 7500),
          enableCompass: true,
          enableZoomControls: true,
          enableDistanceLegend: false
        });
      }

      viewer.scene.postProcessStages.fxaa.enabled = true;
      viewer.scene.globe.depthTestAgainstTerrain = true;

      // Load Terrain
      try {
        const tp = await Cesium.createWorldTerrainAsync();
        viewer.terrainProvider = tp;
        statusEl.textContent = "3D 地形加载完成 · 正在初始化路线...";
      } catch (err) {
        console.error("Terrain init failed:", err);
      }

      // Initial camera view of Mt. Kailash
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(81.2865, 30.9300, 7500),
        orientation: {
          heading: Cesium.Math.toRadians(0.0),
          pitch: Cesium.Math.toRadians(-25.0),
          roll: 0.0
        }
      });

      // Load reference POIs
      try {
        const poisRes = await fetch("data/pois.json");
        const pois = await poisRes.json();
        pois.forEach(poi => {
          viewer.entities.add({
            name: poi.name,
            position: Cesium.Cartesian3.fromDegrees(poi.lng, poi.lat, 0.0),
            point: {
              pixelSize: 8,
              color: Cesium.Color.fromCssColorString('#ffcd55').withAlpha(0.7),
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
              disableDepthTestDistance: 10000000.0
            },
            label: {
              text: poi.name,
              font: 'bold 11px "PingFang SC", "Microsoft YaHei", sans-serif',
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              fillColor: Cesium.Color.fromCssColorString('#ffcd55'), // Golden text label
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 3.0,
              pixelOffset: new Cesium.Cartesian2(0, -12),
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
              disableDepthTestDistance: 10000000.0
            }
          });
        });
      } catch(e) {
        console.error("加载参考 POI 失败:", e);
      }

      // Load routes.json
      try {
        const routesRes = await fetch("data/routes.json");
        const loadedData = await routesRes.json();
        if (loadedData.main) routes.main = loadedData.main;
        if (loadedData.secondary) {
          loadedData.secondary.forEach((s, idx) => {
            if (routes.secondary[idx]) {
              routes.secondary[idx].coords = s.coords || [];
            }
          });
        }
        drawRefLines(loadedData);
      } catch(e) {
        console.error("加载路线数据失败:", e);
      }

      // Create main edit line entity (clamped to terrain)
      editLineEntity = viewer.entities.add({
        name: 'Editing Route Path',
        polyline: {
          positions: new Cesium.CallbackProperty(() => {
            const coords = getCurrentCoords();
            if (coords.length < 2) return undefined;
            return coords.map(c => Cesium.Cartesian3.fromDegrees(c[0], c[1]));
          }, false),
          width: 4.0,
          material: Cesium.Color.fromCssColorString('#00ff88'), // Bright green for editing line
          clampToGround: true
        }
      });

      // Build edit handle dots
      rebuildMarkers();

      // Rebuild markers whenever camera finishes moving (panning/zooming)
      viewer.camera.moveEnd.addEventListener(rebuildMarkers);

      // Interactions
      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

      // LEFT_CLICK: Add new route point or select an existing one
      handler.setInputAction((click) => {
        const picked = viewer.scene.pick(click.position);
        if (Cesium.defined(picked) && Cesium.defined(picked.id)) {
          const entity = picked.id;
          if (entity.id && entity.id.startsWith('drag_')) {
            // Clicked on a point handle, select it!
            selectNode(entity._ptIdx);
            return;
          }
        }
        
        // Clicked empty space: deselect selected node
        deselectNode();

        // Project clicked terrain point
        const ray = viewer.camera.getRay(click.position);
        const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        if (Cesium.defined(cartesian)) {
          const carto = Cesium.Cartographic.fromCartesian(cartesian);
          const lat = parseFloat(Cesium.Math.toDegrees(carto.latitude).toFixed(6));
          const lng = parseFloat(Cesium.Math.toDegrees(carto.longitude).toFixed(6));
          
          const coords = getCurrentCoords();
          coords.push([lng, lat]); // Save as [lng, lat] to routes.json compatibility
          
          rebuildMarkers();
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      // Disable default browser context menu on the map canvas to allow right-click events
      viewer.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // RIGHT_CLICK: Delete a route point when clicking on its drag handle
      handler.setInputAction((click) => {
        const picked = viewer.scene.pick(click.position);
        if (Cesium.defined(picked) && Cesium.defined(picked.id)) {
          const entity = picked.id;
          if (entity.id && entity.id.startsWith('drag_')) {
            const idx = entity._ptIdx;
            const coords = getCurrentCoords();
            if (coords && coords.length > idx) {
              const name = currentKey === "main" ? "主线" : "支线";
              if (confirm(`是否删除${name}的第 ${idx + 1} 个点？`)) {
                coords.splice(idx, 1);
                rebuildMarkers();
                saveToServer();
              }
            }
          }
        }
      }, Cesium.ScreenSpaceEventType.RIGHT_CLICK);

      // MOUSE_MOVE: display coordinates & handle drag-to-move route point
      handler.setInputAction((movement) => {
        const ray = viewer.camera.getRay(movement.endPosition);
        const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        
        if (Cesium.defined(cartesian)) {
          const carto = Cesium.Cartographic.fromCartesian(cartesian);
          const lat = Cesium.Math.toDegrees(carto.latitude);
          const lng = Cesium.Math.toDegrees(carto.longitude);
          document.getElementById("coordDisplay").textContent = lat.toFixed(6) + ", " + lng.toFixed(6);
        }

        if (isDragging && dragEntity) {
          if (Cesium.defined(cartesian)) {
            dragEntity.position = cartesian;
            const carto = Cesium.Cartographic.fromCartesian(cartesian);
            const lat = parseFloat(Cesium.Math.toDegrees(carto.latitude).toFixed(6));
            const lng = parseFloat(Cesium.Math.toDegrees(carto.longitude).toFixed(6));

            const idx = dragEntity._ptIdx;
            const coords = getCurrentCoords();
            if (coords[idx]) {
              coords[idx] = [lng, lat];
              // Update selected node panel inputs in real-time
              if (selectedNodeIdx === idx) {
                document.getElementById("nodeLng").value = lng.toFixed(6);
                document.getElementById("nodeLat").value = lat.toFixed(6);
              }
            }
          }
        }
      }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

      // LEFT_DOWN: start dragging point
      handler.setInputAction((click) => {
        const picked = viewer.scene.pick(click.position);
        if (Cesium.defined(picked) && Cesium.defined(picked.id)) {
          const entity = picked.id;
          if (entity.id && entity.id.startsWith('drag_')) {
            isDragging = true;
            dragEntity = entity;
            viewer.scene.screenSpaceCameraController.enableInputs = false; // Lock map rotations
          }
        }
      }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

      // LEFT_UP: stop dragging point
      handler.setInputAction(() => {
        if (isDragging) {
          isDragging = false;
          dragEntity = null;
          viewer.scene.screenSpaceCameraController.enableInputs = true; // Unlock map
          saveToServer();
          rebuildMarkers();
        }
      }, Cesium.ScreenSpaceEventType.LEFT_UP);

      statusEl.textContent = "点击底图任意位置增加路线点，鼠标拖拽节点可调整路径";
    }

    // ---- Reference Lines ----
    function drawRefLines(loadedData) {
      if (!loadedData) return;
      
      // Clear old reference entities
      refLineEntities.forEach(ent => viewer.entities.remove(ent));
      refLineEntities = [];

      const mainColor = Cesium.Color.RED.withAlpha(refVisible ? 0.45 : 0.0);
      const secondaryColor = Cesium.Color.ORANGE.withAlpha(refVisible ? 0.45 : 0.0);

      // Main Reference Route
      if (loadedData.main && loadedData.main.length) {
        const pos = loadedData.main.map(pt => Cesium.Cartesian3.fromDegrees(pt[0], pt[1]));
        const ent = viewer.entities.add({
          name: 'Old Main Reference Route',
          polyline: {
            positions: pos,
            width: 2.0,
            material: new Cesium.PolylineDashMaterialProperty({
              color: mainColor,
              dashLength: 8.0
            }),
            clampToGround: true
          }
        });
        refLineEntities.push(ent);
      }

      // Secondary Reference Routes
      if (loadedData.secondary) {
        loadedData.secondary.forEach(sr => {
          if (sr.coords && sr.coords.length) {
            const pos = sr.coords.map(pt => Cesium.Cartesian3.fromDegrees(pt[0], pt[1]));
            const ent = viewer.entities.add({
              name: 'Old Branch Reference Route: ' + sr.name,
              polyline: {
                positions: pos,
                width: 1.5,
                material: new Cesium.PolylineDashMaterialProperty({
                  color: secondaryColor,
                  dashLength: 6.0
                }),
                clampToGround: true
              }
            });
            refLineEntities.push(ent);
          }
        });
      }
    }

    function toggleRef() {
      refVisible = !refVisible;
      document.getElementById("refToggle").classList.toggle("active", refVisible);
      refLineEntities.forEach(ent => {
        if (ent.polyline) {
          const color = ent.polyline.material.color.getValue();
          ent.polyline.material.color = color.withAlpha(refVisible ? 0.45 : 0.0);
        }
      });
    }

    // ---- Rebuild Point Handles ----
    function rebuildMarkers() {
      // Clear old handle entities
      dragMarkers.forEach(ent => viewer.entities.remove(ent));
      dragMarkers = [];

      const coords = getCurrentCoords();
      if (!coords || coords.length === 0) {
        updateCount();
        return;
      }

      // Check camera height to prevent rendering too many handles on the 12,500+ coordinates
      const cameraCarto = Cesium.Cartographic.fromCartesian(viewer.camera.position);
      const cameraHeight = cameraCarto ? cameraCarto.height : 5000;
      const statusEl = document.getElementById("statusText");
      if (cameraHeight > 18000) {
        statusEl.textContent = "🔍 提示：请放大视角，系统将自动显示该区域的可编辑手势节点。";
        updateCount();
        return;
      }

      statusEl.textContent = "点击底图增加点，拖拽节点调整，左键点击手势点可选中编辑/删除。";

      const rect = viewer.camera.computeViewRectangle();
      const isMain = currentKey === "main";
      const dotColor = isMain ? Cesium.Color.fromCssColorString('#00ff88') : Cesium.Color.fromCssColorString('#66ccff');

      let renderedCount = 0;
      coords.forEach((c, idx) => {
        const lng = c[0];
        const lat = c[1];

        // Filter: only show handles inside current viewport
        if (rect) {
          const radLng = Cesium.Math.toRadians(lng);
          const radLat = Cesium.Math.toRadians(lat);
          const inView = radLng >= rect.west && radLng <= rect.east && radLat >= rect.south && radLat <= rect.north;
          if (!inView) return;
        }

        // Limit handles count to 150 to keep browser butter smooth
        if (renderedCount >= 150) return;
        renderedCount++;

        const isSelected = selectedNodeIdx === idx;
        const ent = viewer.entities.add({
          id: 'drag_' + idx + '_' + Date.now(),
          position: Cesium.Cartesian3.fromDegrees(lng, lat, 0.0),
          point: {
            pixelSize: isSelected ? 14 : 10,
            color: isSelected ? Cesium.Color.GOLD : dotColor,
            outlineColor: isSelected ? Cesium.Color.RED : Cesium.Color.WHITE,
            outlineWidth: isSelected ? 3 : 2,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: 10000000.0
          },
          label: {
            text: (idx + 1).toString(),
            font: isSelected ? 'bold 10px monospace' : 'bold 9px monospace',
            fillColor: isSelected ? Cesium.Color.RED : Cesium.Color.BLACK,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 1.0,
            pixelOffset: new Cesium.Cartesian2(0, 0),
            verticalOrigin: Cesium.VerticalOrigin.CENTER,
            horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: 10000000.0
          }
        });
        ent._ptIdx = idx;
        dragMarkers.push(ent);
      });

      updateCount();
    }

    // ---- Edit Actions ----
    function undo() {
      const coords = getCurrentCoords();
      if (coords.length === 0) return;
      coords.pop();
      rebuildMarkers();
      saveToServer();
    }

    function clearCurrent() {
      if (!confirm("确认清空当前所选路线的所有点吗？")) return;
      setCurrentCoords([]);
      rebuildMarkers();
      saveToServer();
    }

    function switchRoute(key) {
      currentKey = key;
      const isMain = currentKey === "main";
      document.getElementById("statusText").textContent =
        "正在编辑路线：" + document.getElementById("routeSelect").selectedOptions[0].text;
      rebuildMarkers();
    }

    // ---- Save & Export ----
    async function saveToServer() {
      const out = {
        main: routes.main,
        secondary: routes.secondary.map(s => ({ name: s.name, coords: s.coords }))
      };
      
      try {
        const res = await fetch("/api/save-routes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(out, null, 2)
        });
        const result = await res.json();
        if (result.ok) {
          document.getElementById("statusText").textContent = "✅ 路线已成功自动保存到本地 & 正在推送 GitHub...";
          pollGitStatus();
        } else {
          throw new Error(result.error);
        }
      } catch (err) {
        document.getElementById("statusText").textContent = "⚠️ 保存失败，请点击 [导出 JSON] 手动下载备份";
      }
    }

    let gitPollTimer = null;
    function pollGitStatus() {
      if (gitPollTimer) clearInterval(gitPollTimer);
      let attempts = 0;
      const statusEl = document.getElementById("statusText");
      gitPollTimer = setInterval(async () => {
        attempts++;
        try {
          const r = await fetch("/api/git-status");
          const s = await r.json();
          if (s.status === "success") {
            statusEl.textContent = "✅ 路线保存成功 · 🚀 已自动编译推送 GitHub，线上即将同步！";
            clearInterval(gitPollTimer);
          } else if (s.status === "error") {
            statusEl.textContent = "⚠️ Git 推送失败: " + s.message;
            clearInterval(gitPollTimer);
          }
        } catch(e) {}
        if (attempts > 30) clearInterval(gitPollTimer);
      }, 1000);
    }

    function exportJSON() {
      const out = {
        main: routes.main,
        secondary: routes.secondary.map(s => ({ name: s.name, coords: s.coords }))
      };
      const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "routes.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    // ---- Node Selection Panel Functions ----
    function selectNode(idx) {
      selectedNodeIdx = idx;
      const coords = getCurrentCoords();
      if (!coords || !coords[idx]) {
        deselectNode();
        return;
      }
      
      const panel = document.getElementById("nodePanel");
      panel.style.display = "flex";
      document.getElementById("panelTitle").textContent = `选中节点 #${idx + 1}`;
      document.getElementById("nodeLng").value = coords[idx][0].toFixed(6);
      document.getElementById("nodeLat").value = coords[idx][1].toFixed(6);
      
      rebuildMarkers();
    }

    function deselectNode() {
      if (selectedNodeIdx === null) return;
      selectedNodeIdx = null;
      document.getElementById("nodePanel").style.display = "none";
      rebuildMarkers();
    }

    // Node Panel Inputs & Actions
    document.getElementById("nodeLng").addEventListener("change", (e) => {
      if (selectedNodeIdx === null) return;
      const val = parseFloat(e.target.value);
      if (!isNaN(val)) {
        const coords = getCurrentCoords();
        coords[selectedNodeIdx][0] = val;
        rebuildMarkers();
        saveToServer();
      }
    });

    document.getElementById("nodeLat").addEventListener("change", (e) => {
      if (selectedNodeIdx === null) return;
      const val = parseFloat(e.target.value);
      if (!isNaN(val)) {
        const coords = getCurrentCoords();
        coords[selectedNodeIdx][1] = val;
        rebuildMarkers();
        saveToServer();
      }
    });

    document.getElementById("delNodeBtn").addEventListener("click", () => {
      if (selectedNodeIdx === null) return;
      const coords = getCurrentCoords();
      const name = currentKey === "main" ? "主线" : "支线";
      if (confirm(`是否删除${name}的第 ${selectedNodeIdx + 1} 个点？`)) {
        coords.splice(selectedNodeIdx, 1);
        deselectNode();
        saveToServer();
      }
    });

    document.getElementById("closePanelBtn").addEventListener("click", deselectNode);

    // ---- Bindings ----
    document.getElementById("undoBtn").addEventListener("click", undo);
    document.getElementById("clearBtn").addEventListener("click", clearCurrent);
    document.getElementById("refToggle").addEventListener("click", toggleRef);
    document.getElementById("saveBtn").addEventListener("click", saveToServer);
    document.getElementById("exportBtn").addEventListener("click", exportJSON);
    document.getElementById("routeSelect").addEventListener("change", (e) => {
      deselectNode();
      switchRoute(e.target.value);
    });

    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "z") { e.preventDefault(); undo(); }
    });

    init();
  </script>
</body>
</html>
