<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地缘政治与时空沙盘推演编译器 (GeoNarrative Engine)</title>
  <!-- CesiumJS -->
  <script src="https://unpkg.com/cesium@1.107.0/Build/Cesium/Cesium.js"></script>
  <link href="https://unpkg.com/cesium@1.107.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #09090b;
      --bg-panel: rgba(18, 18, 24, 0.85);
      --bg-glass: rgba(25, 25, 35, 0.65);
      --border-glass: rgba(255, 255, 255, 0.08);
      --accent-gold: #ffcd55;
      --accent-mint: #10b981;
      --accent-red: #ef4444;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

    /* Layout */
    .app-container { display: flex; height: 100vh; width: 100vw; position: relative; }
    
    .sidebar-left {
      width: 420px;
      max-width: 90vw;
      height: 100%;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      z-index: 10;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      backdrop-filter: blur(12px);
    }
    .sidebar-left.collapsed {
      transform: translateX(-100%);
      position: absolute;
    }
    
    /* Collapse Handle */
    .sidebar-toggle-btn {
      position: absolute;
      top: 50%;
      right: -20px;
      width: 20px;
      height: 70px;
      transform: translateY(-50%);
      background: var(--bg-panel);
      border: 1px solid var(--border-glass);
      border-left: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      z-index: 11;
      transition: background 0.2s, color 0.2s, right 0.3s;
      backdrop-filter: blur(8px);
    }
    .sidebar-left.collapsed .sidebar-toggle-btn {
      right: -24px;
      width: 24px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--accent-mint);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }
    .sidebar-toggle-btn:hover {
      color: var(--accent-gold);
      background: rgba(255, 255, 255, 0.05);
    }
    .sidebar-left.collapsed .sidebar-toggle-btn:hover {
      color: var(--accent-gold);
    }
    .sidebar-left .icon-expand { display: none; }
    .sidebar-left.collapsed .icon-collapse { display: none; }
    .sidebar-left.collapsed .icon-expand { display: block; }

    /* Left Panel Sections */
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .panel-header h2 { font-size: 15px; font-weight: 600; color: var(--accent-gold); letter-spacing: 1.5px; }
    .panel-header p { font-size: 11px; color: var(--text-muted); }

    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      gap: 12px;
      border-bottom: 1px solid var(--border-glass);
    }
    .editor-toolbar { display: flex; gap: 8px; }
    .editor-toolbar button {
      flex: 1; padding: 8px 12px; font-size: 11.5px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border-glass);
      background: rgba(255,255,255,0.03); color: var(--text-main); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s;
    }
    .editor-toolbar button.primary {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border-color: #059669;
      color: #fff;
    }
    .editor-toolbar button.primary:hover {
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      transform: translateY(-1px);
    }
    .editor-toolbar button:hover:not(.primary) {
      background: rgba(255,255,255,0.08);
      color: var(--accent-gold);
    }
    
    .code-textarea {
      flex: 1;
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      color: #a7f3d0; /* Minty tint for YAML code */
      font-family: "Fira Code", Monaco, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.6;
      padding: 12px;
      resize: none;
      outline: none;
    }
    .code-textarea:focus {
      border-color: var(--accent-mint);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.15);
    }

    .events-board-section {
      height: 220px;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      gap: 8px;
    }
    .events-board-section h3 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .events-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .event-board-item {
      padding: 10px 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-glass);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .event-board-item:hover {
      background: rgba(255,205,85,0.08);
      border-color: var(--accent-gold);
    }
    .event-board-item.active {
      background: rgba(16,185,129,0.08);
      border-color: var(--accent-mint);
    }
    .event-board-name { font-size: 12px; font-weight: 500; }
    .event-board-date { font-size: 10px; color: var(--text-muted); }

    /* Right Canvas Container */
    .canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
    }
    #map { width: 100%; height: 100%; }

    /* HUD Controls overlay */
    .timeline-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      max-width: calc(100% - 40px);
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(16px);
      border-radius: 30px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-gold);
      border: none;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .play-btn:hover {
      transform: scale(1.08);
      background: #ffe39a;
    }
    .timeline-status {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .timeline-date-label { font-size: 13px; font-weight: 600; color: var(--text-main); letter-spacing: 0.5px; }
    .timeline-progress-desc { font-size: 10px; color: var(--text-muted); }

    .speed-slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .speed-label { font-size: 10px; color: var(--text-muted); }
    .speed-slider {
      width: 80px;
      accent-color: var(--accent-mint);
      cursor: pointer;
    }

    /* Narrative Cards Overlay (Top-Right) */
    .narrative-card {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 320px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 16px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: opacity 0.3s, transform 0.3s;
    }
    .narrative-card.hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }
    .narrative-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .narrative-card-title { font-size: 14px; font-weight: 600; color: var(--accent-gold); line-height: 1.4; }
    .narrative-card-date { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .narrative-card-desc { font-size: 12px; color: var(--text-main); line-height: 1.5; text-align: justify; }
    .narrative-card-media {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .narrative-card-media img { width: 100%; display: block; }

    /* Subtitle banner (Bottom) */
    .subtitle-banner {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      max-width: calc(100% - 40px);
      text-align: center;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px 16px;
      color: #fff;
      font-size: 13.5px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      z-index: 9;
      pointer-events: none;
      display: none;
    }
    .subtitle-banner.active { display: block; }

    /* Responsive adjustments */
    @media (max-width: 1200px) {
      .sidebar-left {
        width: 360px;
      }
      .cesium-viewer-toolbar {
        right: 360px !important; /* Keep it left of the narrative card */
      }
    }

    @media (max-width: 900px) {
      .timeline-overlay {
        padding: 8px 16px;
        border-radius: 20px;
        gap: 12px;
      }
      .timeline-overlay .speed-slider-container {
        display: none; /* Hide speed slider on smaller views */
      }
      .subtitle-banner {
        bottom: 74px;
      }
    }

    /* Loader Overlay */
    .loader-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 9, 11, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .loader-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 205, 85, 0.1);
      border-top-color: var(--accent-gold);
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    .loader-text { margin-top: 16px; font-size: 13px; color: var(--accent-gold); letter-spacing: 1px; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide Cesium standard widgets and customize search */
    .cesium-viewer-bottom { display: none !important; }
    .cesium-viewer-toolbar {
      top: 20px !important;
      right: 360px !important;
      left: auto !important;
    }
    .cesium-geocoder-input {
      background-color: rgba(20, 20, 25, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 20px 0 0 20px !important;
      color: #fff !important;
      font-size: 12px !important;
      padding-left: 10px !important;
      height: 32px !important;
      backdrop-filter: blur(8px) !important;
    }
    .cesium-geocoder-searchButton {
      background-color: rgba(20, 20, 25, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-left: none !important;
      border-radius: 0 20px 20px 0 !important;
      height: 32px !important;
      fill: #ffcd55 !important;
      backdrop-filter: blur(8px) !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Loader overlay -->
    <div id="loaderOverlay" class="loader-overlay">
      <div class="spinner"></div>
      <div id="loaderText" class="loader-text">正在编译时空数据并渲染沙盘...</div>
    </div>

    <!-- Left Sidebar -->
    <div class="sidebar-left" id="sidebar">
      
      <!-- Drawer handle -->
      <button class="sidebar-toggle-btn" id="btnToggleSidebar" aria-label="Toggle Sidebar">
        <svg class="icon-collapse" width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 1L1 5L5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-expand" width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1L5 5L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="panel-header">
        <h2>GeoNarrative Engine</h2>
        <p>事件驱动的地理地缘时空叙事编译器 v1.1</p>
      </div>

      <div class="editor-section">
        <div class="editor-toolbar">
          <button id="btnCompile" class="primary">🚀 编译并推演</button>
          <button id="btnTemplate">📋 导入模板</button>
        </div>
        <textarea id="dslTextarea" class="code-textarea" spellcheck="false" placeholder="在此输入时空叙事脚本 (DSL YAML)..."></textarea>
      </div>

      <div class="events-board-section">
        <h3>事件推演看板 (Events)</h3>
        <div class="events-list" id="eventsList">
          <div style="font-size: 11px; color: var(--text-muted); text-align: center; padding-top: 30px;">
            点击右上角 [编译并推演] 载入历史事件流
          </div>
        </div>
      </div>

    </div>

    <!-- Main Canvas Area -->
    <div class="canvas-container">
      
      <div id="map"></div>

      <!-- Timeline Overlay HUD -->
      <div class="timeline-overlay">
        <button id="btnPlay" class="play-btn" title="播放 / 暂停">▶</button>
        <div class="timeline-status">
          <span id="dateLabel" class="timeline-date-label">📅 准备编译...</span>
          <span id="progressDesc" class="timeline-progress-desc">点击左侧推演按钮以生成历史轨迹</span>
        </div>
        <div class="speed-slider-container">
          <span class="speed-label">推演速度</span>
          <input type="range" id="speedSlider" min="1" max="10" value="3" class="speed-slider" title="控制时间流逝倍率" />
        </div>
      </div>

      <!-- Narrative Overlay Card -->
      <div id="narrativeCard" class="narrative-card hidden">
        <div class="narrative-card-header">
          <div>
            <h3 id="cardTitle" class="narrative-card-title"></h3>
            <span id="cardDate" class="narrative-card-date"></span>
          </div>
        </div>
        <p id="cardDesc" class="narrative-card-desc"></p>
        <div id="cardMediaContainer" class="narrative-card-media"></div>
      </div>

      <!-- Subtitle display banner -->
      <div id="subtitleBanner" class="subtitle-banner"></div>

    </div>

  </div>

  <script>
    // Cesium token
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJhZDY0YWY3Yy1mZmQ1LTQ2MjgtYTRjZi01OTM0NzQ3YjljOGMiLCJpZCI6NDM2NzA2LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzk4MDU4MjZ9.80efk41binldWGgit3mGqqZ3keritykzZUoNw0qoQc0';

    let viewer;
    let loadedDataSources = [];
    let eventsMetadata = [];
    let lastActiveEventId = null;
    let isPlaying = false;
    let activeIntervalId = null;
    
    // Sidebar toggle
    const sidebar = document.querySelector(".sidebar-left");
    const toggleBtn = document.getElementById("btnToggleSidebar");
    const toggleSidebar = () => {
      sidebar.classList.toggle("collapsed");
      setTimeout(() => {
        if (viewer) {
          viewer.canvas.width = viewer.canvas.clientWidth;
          viewer.canvas.height = viewer.canvas.clientHeight;
        }
      }, 350);
    };
    toggleBtn.addEventListener("click", toggleSidebar);

    const panelHeader = document.querySelector(".panel-header");
    if (panelHeader) {
      panelHeader.style.cursor = 'pointer';
      panelHeader.title = '点击折叠/展开侧边栏';
      panelHeader.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;
        toggleSidebar();
      });
    }

    // Default template DSL
    const defaultDsl = `project:
  id: "longmarch_campaign"
  title: "红军长征与遵义转折地缘沙盘推演"
  author: "GeoNarrative Compiler"
  version: "1.0"

locations:
  - id: "loc_yudu"
    name: "于都河畔"
    latitude: 25.9523
    longitude: 115.4208
    altitude: 120.0
    region: "江西赣州"
  - id: "loc_xiangjiang"
    name: "湘江渡口"
    latitude: 25.7533
    longitude: 110.8205
    altitude: 150.0
    region: "广西桂林"
  - id: "loc_tongdao"
    name: "通道县城"
    latitude: 26.1554
    longitude: 109.7823
    altitude: 320.0
    region: "湖南怀化"
  - id: "loc_xiangxi_blockade"
    name: "湘西口袋封锁线"
    latitude: 27.2
    longitude: 110.5
    altitude: 400.0
    region: "湖南湘西地区"
  - id: "loc_zunyi"
    name: "遵义会址"
    latitude: 27.6963
    longitude: 106.9272
    altitude: 850.0
    region: "贵州遵义"

events:
  - id: "evt_001_departure"
    title: "1. 战略突围·星夜渡过于都河"
    date_start: "1934-10-16"
    date_end: "1934-10-20"
    location: "loc_yudu"
    importance: 5
    description: "中央红军主力八万余人，分别在于都县的八个渡口渡过于都河，踏上战略突围长征路。这是整个长征史诗的起点。"
    narrative_cues:
      - trigger: "on_enter"
        action: "camera"
        payload:
          heading: 180.0
          pitch: -30.0
          range: 12000.0
      - trigger: "on_enter"
        action: "subtitle"
        payload:
          text: "【长征起点】中央红军八万精兵渡过于都河，长征第一步！"
    media:
      - file: "assets/1jt.png"
        caption: "于都河畔长征集结"
        type: "image"

  - id: "evt_002_xiangjiang"
    title: "2. 惨烈会战·血战湘江"
    date_start: "1934-11-27"
    date_end: "1934-12-01"
    location: "loc_xiangjiang"
    importance: 5
    description: "红军突破国民党第四道封锁线，与敌人在全州、兴安展开生死决战。红军伤亡过半，人员锐减至三万人。"
    narrative_cues:
      - trigger: "on_enter"
        action: "camera"
        payload:
          heading: 200.0
          pitch: -28.0
          range: 16000.0
      - trigger: "on_enter"
        action: "subtitle"
        payload:
          text: "【血战湘江】三年不饮湘江水，十年不食湘江鱼"
      - trigger: "on_enter"
        action: "symbol"
        payload:
          symbol_type: "arrow"
          color: "#ef4444"
          width_ratio: 0.04

  - id: "evt_003_tongdao"
    title: "3. 战略抉择·通道转兵"
    date_start: "1934-12-12"
    date_end: "1934-12-14"
    location: "loc_tongdao"
    importance: 4
    description: "鉴于蒋介石已在湘西集结重兵设伏，红军在湖南通道召开会议，毛泽东极力主张转兵贵州，避实就虚，挽救了危机中的红军。"
    narrative_cues:
      - trigger: "on_enter"
        action: "camera"
        payload:
          heading: 260.0
          pitch: -35.0
          range: 10000.0
      - trigger: "on_enter"
        action: "subtitle"
        payload:
          text: "【通道决策】紧急避开湘西重兵封锁线，红军改投兵力薄弱的贵州！"
      - trigger: "on_enter"
        action: "symbol"
        payload:
          symbol_type: "arrow"
          color: "#22c55e"
          width_ratio: 0.035
          from_location: "loc_xiangjiang"
      - trigger: "on_enter"
        action: "symbol"
        payload:
          symbol_type: "arrow"
          color: "#ef4444"
          opacity: 0.4
          width_ratio: 0.02
          from_location: "loc_xiangjiang"
          to_location: "loc_xiangxi_blockade"
      - trigger: "on_enter"
        action: "symbol"
        payload:
          symbol_type: "zone"
          color: "#dc2626"
          opacity: 0.25
          radius: 0.6
          location: "loc_xiangxi_blockade"

  - id: "evt_004_zunyi"
    title: "4. 历史转折·遵义会议"
    date_start: "1935-01-15"
    date_end: "1935-01-17"
    location: "loc_zunyi"
    importance: 5
    description: "中共中央在贵州遵义召开政治局扩大会议。会议结束了“左”倾冒险主义在中央的统治，事实上确立了毛泽东同志在红军和党中央的领导地位。"
    narrative_cues:
      - trigger: "on_enter"
        action: "camera"
        payload:
          heading: 320.0
          pitch: -32.0
          range: 6500.0
      - trigger: "on_enter"
        action: "subtitle"
        payload:
          text: "【伟大转折】遵义会议确立了毛泽东的军事指挥权，战略局势彻底改观！"
      - trigger: "on_enter"
        action: "symbol"
        payload:
          symbol_type: "arrow"
          color: "#10b981"
          width_ratio: 0.03
          from_location: "loc_tongdao"

routes:
  - id: "route_yudu_to_xiangjiang"
    from_event: "evt_001_departure"
    to_event: "evt_002_xiangjiang"
    coordinates:
      - [115.4208, 25.9523, 120.0]
      - [114.3055, 25.4022, 350.0]
      - [113.1022, 24.8011, 480.0]
      - [111.9022, 25.2011, 400.0]
      - [110.8205, 25.7533, 150.0]
  - id: "route_xiangjiang_to_tongdao"
    from_event: "evt_002_xiangjiang"
    to_event: "evt_003_tongdao"
    coordinates:
      - [110.8205, 25.7533, 150.0]
      - [110.1022, 25.9011, 280.0]
      - [109.7823, 26.1554, 320.0]
  - id: "route_tongdao_to_zunyi"
    from_event: "evt_003_tongdao"
    to_event: "evt_004_zunyi"
    coordinates:
      - [109.7823, 26.1554, 320.0]
      - [108.5022, 26.5011, 600.0]
      - [107.5022, 27.2011, 750.0]
      - [106.9272, 27.6963, 850.0]`;

    // Load template
    document.getElementById("dslTextarea").value = defaultDsl;
    document.getElementById("btnTemplate").addEventListener("click", () => {
      document.getElementById("dslTextarea").value = defaultDsl;
    });

    async function init() {
      // 1. Initialize viewer
      viewer = new Cesium.Viewer("map", {
        animation: true,
        timeline: true,
        baseLayerPicker: false,
        fullscreenButton: false,
        geocoder: true,
        homeButton: false,
        infoBox: false,
        selectionIndicator: false,
        navigationHelpButton: false
      });

      // Style Geocoder input box
      const geocoder = viewer.geocoder;
      
      // Load 3D Terrain
      try {
        const terrainProvider = await Cesium.createWorldTerrainAsync();
        viewer.terrainProvider = terrainProvider;
      } catch (e) {
        console.warn("World Terrain load failed, using default ellipsoid.", e);
      }

      viewer.scene.globe.depthTestAgainstTerrain = true;
      viewer.scene.postProcessStages.fxaa.enabled = true;

      // Default camera view pointing at Mount Kailash or Central China
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(112.0, 26.0, 800000.0),
        orientation: {
          heading: Cesium.Math.toRadians(0.0),
          pitch: Cesium.Math.toRadians(-55.0),
          roll: 0.0
        }
      });

      // Hook clock tick
      viewer.clock.onTick.addEventListener(handleClockTick);

      // Play/Pause button
      const playBtn = document.getElementById("btnPlay");
      playBtn.addEventListener("click", togglePlayback);

      // Speed Slider
      const speedSlider = document.getElementById("speedSlider");
      speedSlider.addEventListener("input", (e) => {
        if (viewer) {
          // multiplier is days per second. 
          // slider 1-10 mapped to: 1 = 0.5 day/s, 2 = 1 day/s, 3 = 2 days/s, etc.
          const val = parseInt(e.target.value);
          viewer.clock.multiplier = 86400 * val;
        }
      });
      
      // Build button click
      document.getElementById("btnCompile").addEventListener("click", compileAndPlay);

      // Window Resize Listener for responsiveness
      window.addEventListener('resize', () => {
        if (viewer) {
          viewer.canvas.width = viewer.canvas.clientWidth;
          viewer.canvas.height = viewer.canvas.clientHeight;
        }
      });
    }

    function togglePlayback() {
      if (!viewer) return;
      const clock = viewer.clock;
      clock.shouldAnimate = !clock.shouldAnimate;
      document.getElementById("btnPlay").textContent = clock.shouldAnimate ? "⏸" : "▶";
    }

    function handleClockTick() {
      if (!viewer || eventsMetadata.length === 0) return;

      const currentTime = viewer.clock.currentTime;
      const currentJulianDate = Cesium.JulianDate.toIso8601(currentTime);
      const currentDateStr = currentJulianDate.split("T")[0];

      document.getElementById("dateLabel").textContent = `📅 当前推演时间: ${currentDateStr}`;

      // Sync military symbols visibility with current date
      loadedDataSources.forEach(ds => {
        if (ds instanceof Cesium.GeoJsonDataSource) {
          ds.entities.values.forEach(entity => {
            if (entity.properties && entity.properties.type && entity.properties.type.getValue() === "military_symbol") {
              const dateVal = entity.properties.date ? entity.properties.date.getValue() : null;
              if (dateVal) {
                entity.show = (currentDateStr >= dateVal);
              }
            }
          });
        }
      });

      // Check active event
      let activeEvent = null;
      for (let evt of eventsMetadata) {
        const start = evt.date_start;
        const end = evt.date_end || evt.date_start;
        if (currentDateStr >= start && currentDateStr <= end) {
          activeEvent = evt;
          break;
        }
      }

      const card = document.getElementById("narrativeCard");
      const banner = document.getElementById("subtitleBanner");

      if (activeEvent) {
        // Show overlay card
        card.classList.remove("hidden");
        document.getElementById("cardTitle").textContent = activeEvent.title;
        document.getElementById("cardDate").textContent = `📅 ${activeEvent.date_start} ${activeEvent.date_end ? ' ~ ' + activeEvent.date_end : ''}`;
        document.getElementById("cardDesc").textContent = activeEvent.description;
        
        // Image display
        const mediaContainer = document.getElementById("cardMediaContainer");
        mediaContainer.innerHTML = "";
        if (activeEvent.media && activeEvent.media.length > 0) {
          const m = activeEvent.media[0];
          // We can fallback to default files if file path is local
          let filePath = m.file;
          if (filePath.startsWith('assets/')) {
            // strip and align
            filePath = filePath;
          }
          mediaContainer.innerHTML = `<img src="${filePath}" alt="${m.caption || ''}" onerror="this.src='assets/01.jpg'" />`;
        }

        // Subtitle & Camera Cues Trigger
        let subText = "";
        for (let cue of activeEvent.narrative_cues) {
          if (cue.action === "subtitle") {
            subText = cue.payload.text;
          }
        }
        
        if (subText) {
          banner.classList.add("active");
          banner.textContent = subText;
        } else {
          banner.classList.remove("active");
        }

        // Camera flight (Triggered once when entering this event)
        if (lastActiveEventId !== activeEvent.id) {
          lastActiveEventId = activeEvent.id;
          
          // Focus in list
          highlightEventInList(activeEvent.id);

          // Fly camera if defined
          for (let cue of activeEvent.narrative_cues) {
            if (cue.action === "camera" && cue.payload) {
              const coords = activeEvent.location.coords;
              if (coords && coords.length >= 2) {
                const head = cue.payload.heading || 0.0;
                const pitch = cue.payload.pitch || -30.0;
                const range = cue.payload.range || 10000.0;

                viewer.camera.flyTo({
                  destination: Cesium.Cartesian3.fromDegrees(coords[0], coords[1] - 0.012, range * 0.8),
                  orientation: {
                    heading: Cesium.Math.toRadians(head),
                    pitch: Cesium.Math.toRadians(pitch),
                    roll: 0.0
                  },
                  duration: 2.0
                });
              }
            }
          }
        }
      } else {
        // Clear HUD if no active event
        card.classList.add("hidden");
        banner.classList.remove("active");
        lastActiveEventId = null;
        unhighlightAllEvents();
      }
    }

    async function compileAndPlay() {
      const yamlContent = document.getElementById("dslTextarea").value.trim();
      if (!yamlContent) {
        alert("请输入 YAML 时空脚本后再进行编译！");
        return;
      }

      // Show loader
      const loader = document.getElementById("loaderOverlay");
      loader.classList.add("active");

      try {
        const response = await fetch("api/compile-narrative", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ yamlContent })
        });

        const res = await response.json();
        if (res.error) {
          alert("编译失败！编译器返回错误：\n" + res.error);
          return;
        }

        // Success! Reload sources
        clearOldSources();

        // 1. Load GeoJSON (Symbols/Arrows)
        const geojsonUrl = res.geojsonUrl + "?t=" + Date.now();
        const geojsonDS = await Cesium.GeoJsonDataSource.load(geojsonUrl, {
          clampToGround: true
        });
        viewer.dataSources.add(geojsonDS);
        loadedDataSources.push(geojsonDS);

        // Customize symbols colors from properties
        geojsonDS.entities.values.forEach(entity => {
          if (entity.properties && entity.properties.type) {
            const typeVal = entity.properties.type.getValue();
            if (typeVal === "military_symbol") {
              const colorStr = entity.properties.fill.getValue();
              // Style military arrows
              entity.polygon.material = Cesium.Color.fromCssColorString(colorStr).withAlpha(0.6);
              entity.polygon.outlineColor = Cesium.Color.fromCssColorString(colorStr);
              entity.polygon.outlineWidth = 2;
            }
          }
        });

        // 2. Load CZML (Timeline path & POI markers)
        const czmlUrl = res.czmlUrl + "?t=" + Date.now();
        const czmlDS = await Cesium.CzmlDataSource.load(czmlUrl);
        viewer.dataSources.add(czmlDS);
        loadedDataSources.push(czmlDS);

        // 3. Extract Metadata from CZML (Fetch directly from CZML JSON to bypass Cesium PropertyBag restrictions)
        eventsMetadata = [];
        try {
          const czmlResponse = await fetch(czmlUrl);
          if (!czmlResponse.ok) {
            throw new Error(`HTTP error! status: ${czmlResponse.status}`);
          }
          const czmlJson = await czmlResponse.json();
          const metaPacket = czmlJson.find(pkt => pkt.id === "narrative_metadata");
          if (metaPacket && metaPacket.properties && metaPacket.properties.events) {
            eventsMetadata = metaPacket.properties.events;
          } else {
            console.warn("narrative_metadata or events property not found in CZML", czmlJson);
          }
        } catch (err) {
          console.error("Failed to fetch narrative metadata:", err);
          alert("提取事件数据失败，请查看控制台: " + err.message);
        }

        renderEventsList();

        // 4. Focus camera to start location of the first event
        if (eventsMetadata.length > 0) {
          const firstEvent = eventsMetadata[0];
          const coords = firstEvent.location.coords;
          if (coords && coords.length >= 2) {
            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(coords[0], coords[1] - 0.05, 50000.0),
              orientation: {
                heading: Cesium.Math.toRadians(0.0),
                pitch: Cesium.Math.toRadians(-45.0),
                roll: 0.0
              },
              duration: 2.0
            });
          }
        }

        // 5. Setup Clock from CZML
        // CZML automatically sets the Clock properties from the document packet, 
        // but we explicitly enforce play rate and multiplier
        viewer.clock.multiplier = 86400 * 3; // 3 days per second
        viewer.clock.shouldAnimate = true;
        document.getElementById("btnPlay").textContent = "⏸";
        document.getElementById("progressDesc").textContent = "沙盘时空编译成功，推演已自动启动！";

      } catch (err) {
        console.error(" E2E compile error:", err);
        alert("网络请求失败或服务端异常，请检查后端运行状态。");
      } finally {
        loader.classList.remove("active");
      }
    }

    function clearOldSources() {
      loadedDataSources.forEach(ds => {
        viewer.dataSources.remove(ds);
      });
      loadedDataSources = [];
      eventsMetadata = [];
      lastActiveEventId = null;
    }

    function renderEventsList() {
      const container = document.getElementById("eventsList");
      container.innerHTML = "";
      if (eventsMetadata.length === 0) {
        container.innerHTML = `<div style="font-size: 11px; color: var(--text-muted); text-align: center; padding-top: 30px;">未加载到事件数据</div>`;
        return;
      }

      eventsMetadata.forEach(evt => {
        const div = document.createElement("div");
        div.className = "event-board-item";
        div.id = `evt-item-${evt.id}`;
        div.innerHTML = `
          <span class="event-board-name">${evt.title}</span>
          <span class="event-board-date">${evt.date_start}</span>
        `;
        div.addEventListener("click", () => {
          // Jump clock to start of this event
          if (viewer) {
            const dateJulian = Cesium.JulianDate.fromIso8601(`${evt.date_start}T00:00:00Z`);
            viewer.clock.currentTime = dateJulian;
            
            // Camera fly
            const coords = evt.location.coords;
            if (coords && coords.length >= 2) {
              viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(coords[0], coords[1] - 0.015, 12000.0),
                orientation: {
                  heading: Cesium.Math.toRadians(0.0),
                  pitch: Cesium.Math.toRadians(-35.0),
                  roll: 0.0
                },
                duration: 1.5
              });
            }
          }
        });
        container.appendChild(div);
      });
    }

    function highlightEventInList(eventId) {
      unhighlightAllEvents();
      const item = document.getElementById(`evt-item-${eventId}`);
      if (item) {
        item.classList.add("active");
        item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function unhighlightAllEvents() {
      const items = document.querySelectorAll(".event-board-item");
      items.forEach(it => it.classList.remove("active"));
    }

    window.onload = init;
  </script>
</body>
</html>
