<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>叙事编辑器 (3D) · 冈仁波齐 2026</title>
  <!-- CesiumJS -->
  <script src="https://unpkg.com/cesium@1.107.0/Build/Cesium/Cesium.js"></script>
  <link href="https://unpkg.com/cesium@1.107.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <!-- Navigation plugin removed to avoid module import errors -->
  <style>
    :root {
      --bg-dark: #0d0d0f;
      --bg-panel: rgba(22, 22, 28, 0.95);
      --accent: #ffcd55;
      --border: rgba(255, 255, 255, 0.1);
      --text-dim: rgba(255, 255, 255, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-dark); color: #eee; overflow: hidden; }

    /* Layout */
    .app-container { display: flex; height: 100vh; width: 100vw; }
    
    .sidebar-left { width: 300px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
    .main-canvas { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .sidebar-right { width: 340px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }

    /* Header */
    .panel-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .panel-header h2 { font-size: 14px; font-weight: 500; letter-spacing: 1px; color: var(--accent); }
    
    /* Event List */
    .event-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .event-item { 
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer;
      display: flex; gap: 12px; align-items: center; transition: background 0.2s;
    }
    .event-item:hover { background: rgba(255,255,255,0.05); }
    .event-item.active { background: rgba(255, 205, 85, 0.1); border-left: 3px solid var(--accent); }
    .event-icon { width: 32px; height: 32px; border-radius: 6px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .event-info { flex: 1; }
    .event-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .event-meta { font-size: 11px; color: var(--text-dim); }

    /* Map */
    .cesium-viewer-bottom { display: none !important; }
    
        #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .tool-btn { 
      background: rgba(0,0,0,0.8); border: 1px solid var(--border); color: #fff; 
      padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 6px; transition: border-color 0.2s, background-color 0.2s;
    }
    .tool-btn:hover { background: rgba(40,40,45,0.9); border-color: var(--accent); color: var(--accent); }
    .tool-btn.active { background: var(--accent); color: #000; font-weight: 600; }
 
    /* Timeline */
    .bottom-bar { 
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 800px;
      background: rgba(18, 18, 22, 0.9); border: 1px solid var(--border); border-radius: 40px; 
      padding: 12px 24px; z-index: 1000; backdrop-filter: blur(12px);
      display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .play-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .timeline-slider { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px; outline: none; }
    .timeline-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px var(--accent); }

    /* Form */
    .edit-form { padding: 20px; flex: 1; overflow-y: auto; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .form-input, .form-textarea {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; color: #fff; font-size: 13px; outline: none; transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { min-height: 100px; line-height: 1.6; }

    .form-group .checkbox-label { display: flex; align-items: center; gap: 8px; color: #eee; font-size: 12px; cursor: pointer; user-select: none; }
    .form-group .checkbox-label input { width: auto; margin: 0; }

    .camera-card { 
      background: rgba(255, 205, 85, 0.04); border: 1px dashed rgba(255, 205, 85, 0.3); border-radius: 8px; padding: 16px; margin-top: 10px;
    }
    .capture-btn { 
      width: 100%; padding: 10px; background: rgba(255, 205, 85, 0.2); border: 1px solid rgba(255, 205, 85, 0.4); 
      color: var(--accent); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; margin-bottom: 12px;
    }
    .capture-btn:hover { background: rgba(255, 205, 85, 0.3); }

    .action-bar { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .primary-btn { flex: 1; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .secondary-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border); padding: 12px; border-radius: 8px; cursor: pointer; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .status-msg {
      position: fixed; top: 20px; right: 360px; z-index: 2000;
      background: #000; padding: 10px 20px; border-radius: 30px; border: 1px solid var(--accent);
      color: var(--accent); font-size: 12px; display: none; pointer-events: none;
    }
    .map-overlay-tools { position: absolute; top: 20px; left: 20px; z-index: 1000; display: flex; gap: 8px; }

    .dev-log {
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Left: Sequence -->
    <div class="sidebar-left">
      <div class="panel-header">
        <h2>叙事序列 (Narrative)</h2>
        <span style="font-size: 11px; color: var(--text-dim);" id="eventCount">0 节点</span>
      </div>
      <div class="event-list" id="eventList">
        <!-- Event items will be injected here -->
      </div>
      <div class="action-bar">
        <button class="secondary-btn" style="flex:1" id="exportBtn">导出 JSON</button>
      </div>
    </div>

    <!-- Main Map Canvas -->
    <div class="main-canvas">
      <div id="map"></div>
      <!-- Developer error log panel -->
      <div id="devLog" class="dev-log" style="display:none; position:absolute; bottom:0; left:0; right:0; max-height:150px; overflow:auto; background:rgba(0,0,0,0.8); color:#ff6666; font-size:12px; padding:8px; z-index:2000;"></div>
      
      <div class="map-overlay-tools">
        <button class="tool-btn" id="toolAddPoi"><span>📍</span> 添加节点</button>
        <button class="tool-btn" id="toolSync"><span>🔄</span> 同步数据</button>
        <button class="tool-btn" id="btnFullscreen"><span>⛶</span> 全屏</button>
      </div>

      <div class="bottom-bar">
        <button class="play-btn" id="playBtn">▶</button>
        <input type="range" class="timeline-slider" id="timelineSlider" min="0" max="1000" value="0">
        <div style="font-size: 12px; width: 60px; text-align: right; font-family: monospace;" id="timeDisplay">0.0%</div>
      </div>
    </div>

    <!-- Sidebar Right: Properties -->
    <div class="sidebar-right">
      <div class="panel-header">
        <h2>属性编辑 (Properties)</h2>
        <button class="secondary-btn" style="padding: 4px 10px; font-size: 11px;" id="btnDelete">删除</button>
        <button class="secondary-btn" style="padding: 4px 10px; font-size: 11px;" id="btnMoveUp">上移</button>
        <button class="secondary-btn" style="padding: 4px 10px; font-size: 11px;" id="btnMoveDown">下移</button>
      </div>
      <div class="edit-form" id="editForm" style="display:none;">
        <div class="form-group">
          <label>节点 ID (英文标识，必须对应图标名)</label>
          <input type="text" class="form-input" id="fId" placeholder="例如：001 或 wht-blank">
        </div>
        <div class="form-group">
          <label>节点名称</label>
          <input type="text" class="form-input" id="fName" placeholder="例如：大经幡广场">
        </div>
        <div class="form-group">
          <label>节点类型</label>
          <select class="form-input" id="fType">
            <option value="POI">地理标记 (POI)</option>
            <option value="VIEW">镜头视角 (View)</option>
            <option value="ACTION">特殊动作 (Action)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="fFlat">
            <span style="color: var(--accent); font-weight: bold;">贴地扁平 (无图标传统地标，仅显示文字)</span>
          </label>
        </div>
        <div class="form-group">
          <label>叙事内容 (Bubble)</label>
          <textarea class="form-textarea" id="fBubble" placeholder="在这里输入要展示的故事或说明文字..."></textarea>
        </div>
        <div class="form-group">
          <label>图片链接 (Image URL)</label>
          <input type="text" class="form-input" id="fImageUrl" placeholder="粘贴图片直连 URL（支持谷歌硬盘直连）">
        </div>
        <div class="form-group">
          <label>视频链接 (Video URL)</label>
          <input type="text" class="form-input" id="fVideoUrl" placeholder="粘贴视频直连 URL">
        </div>
        
        <div class="camera-card">
          <label style="color: var(--accent); margin-bottom: 12px; display: block;">镜头状态 (Camera State)</label>
          <button class="capture-btn" id="btnCapture">捕获当前 3D 相机视角</button>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label>视线范围 (Range)</label>
              <input type="number" class="form-input" id="fZoom" step="1">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>对焦纬度 (Lat)</label>
              <input type="number" class="form-input" id="fLat" step="0.000001">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>对焦经度 (Lng)</label>
              <input type="number" class="form-input" id="fLng" step="0.000001">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label>相机经度 (Cam Lng)</label>
              <input type="number" class="form-input" id="fCamLng" readonly style="background: rgba(255,255,255,0.02); color: #ccc;">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>相机纬度 (Cam Lat)</label>
              <input type="number" class="form-input" id="fCamLat" readonly style="background: rgba(255,255,255,0.02); color: #ccc;">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>相机高度 (Cam Alt)</label>
              <input type="number" class="form-input" id="fCamHeight" readonly style="background: rgba(255,255,255,0.02); color: #ccc;">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>偏航 (Heading°)</label>
              <input type="number" class="form-input" id="fHeading" step="0.1">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>俯仰 (Pitch°)</label>
              <input type="number" class="form-input" id="fPitch" step="0.1">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>翻滚 (Roll°)</label>
              <input type="number" class="form-input" id="fRoll" step="0.1">
            </div>
          </div>
        </div>

        <div class="form-group" style="margin-top: 20px;">
          <label>驻留时长 (Dwell Seconds)</label>
          <input type="number" class="form-input" id="fDwell" value="8">
        </div>
      </div>
      <div class="action-bar" id="saveBar" style="display:none;">
        <button id="btnUndo" class="secondary-btn">撤销</button>
        <button class="primary-btn" id="btnSave">保存节点</button>
      </div>
    </div>
  </div>

  <div class="status-msg" id="statusMsg">已保存</div>

  <script>
    // Cesium Access Token
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJhZDY0YWY3Yy1mZmQ1LTQ2MjgtYTRjZi01OTM0NzQ3YjljOGMiLCJpZCI6NDM2NzA2LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzk4MDU4MjZ9.80efk41binldWGgit3mGqqZ3keritykzZUoNw0qoQc0';

    // --- State ---
    let data = {
      pois: [],
      routes: { main: [], secondary: [] }
    };
    let activeId = null;
    let viewer;
    let markers = {};
    let pilgrimMarker;
    let addMode = false;
    let playing = false;
    let progress = 0;
    let animationFrameId = null;
    let previousPois = null;

    // Dragging state
    let isDragging = false;
    let dragEntity = null;




// ---- Reference Lines ----
    async function init() {
      try {
        const basePath = './';
        const [pRes, rRes] = await Promise.all([
          fetch(`${basePath}data/pois.json`).catch(() => null),
          fetch(`${basePath}data/routes.json`).catch(() => null)
        ]);

        // Load POI data with error handling
        if (pRes && pRes.ok) {
          data.pois = await pRes.json();
          // Deduplicate POI entries by ID
          const uniquePois = [];
          const seenIds = new Set();
          for (const p of data.pois) {
            if (!p.id) continue;
            if (seenIds.has(p.id)) {
              console.warn(`Duplicate POI ID detected and removed: ${p.id}`);
              continue;
            }
            seenIds.add(p.id);
            uniquePois.push(p);
          }
          data.pois = uniquePois;
        } else {
          console.warn('Failed to load pois.json, starting with empty POI list');
          data.pois = [];
        }

        // Load routes data with error handling
        if (rRes && rRes.ok) {
          data.routes = await rRes.json();
        } else {
          console.warn('Failed to load routes.json, starting with empty routes');
          data.routes = { main: [], secondary: [] };
        }

        // Init Cesium Viewer
        viewer = new Cesium.Viewer('map', {
          animation: false,
          timeline: false,
          baseLayerPicker: false,
          fullscreenButton: false,
          geocoder: false,
          homeButton: false,
          infoBox: false,
          selectionIndicator: true,
          sceneModePicker: false,
          navigationHelpButton: false
        });

        viewer.scene.postProcessStages.fxaa.enabled = true;
        viewer.scene.globe.depthTestAgainstTerrain = true;

        // Terrain Provider
        try {
          const tp = await Cesium.createWorldTerrainAsync();
          viewer.terrainProvider = tp;
        } catch (err) {
          console.error("Terrain provider failed to load in Narrative:", err);
        }

        // Mt. Kailash Focus View
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(81.2865, 30.9300, 7500),
          orientation: {
            heading: Cesium.Math.toRadians(0.0),
            pitch: Cesium.Math.toRadians(-25.0),
            roll: 0.0
          }
        });

        // Draw Main Route Line in 3D
        if (data.routes.main && data.routes.main.length) {
          const positions = data.routes.main.map(pt => Cesium.Cartesian3.fromDegrees(pt[0], pt[1]));
          viewer.entities.add({
            name: 'Kora Route',
            polyline: {
              positions,
              width: 3.5,
              material: Cesium.Color.fromCssColorString('#ffcd55').withAlpha(0.5),
              clampToGround: true
            }
          });
        }

        // Draw Pilgrim Position Indicator
        if (data.routes.main && data.routes.main.length) {
          const startPt = data.routes.main[0];
          pilgrimMarker = viewer.entities.add({
            name: 'Pilgrim Position',
            position: Cesium.Cartesian3.fromDegrees(startPt[0], startPt[1], 0.0),
            point: {
              pixelSize: 12,
              color: Cesium.Color.WHITE,
              outlineColor: Cesium.Color.fromCssColorString('#ffcd55'),
              outlineWidth: 3.0,
              heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
              disableDepthTestDistance: 10000000.0
            }
          });
        }

        // Refresh Markers on Map
        refreshMarkers();
        refreshEventList();
        
        // Bind UI Elements
        document.getElementById('toolAddPoi').addEventListener('click', toggleAddMode);
        document.getElementById('btnSave').addEventListener('click', saveActive);
        document.getElementById('btnUndo').addEventListener('click', undoLastEdit);
        document.getElementById('btnCapture').addEventListener('click', captureCamera);
        document.getElementById('exportBtn').addEventListener('click', exportData);
        document.getElementById('playBtn').addEventListener('click', togglePlay);
        document.getElementById('btnDelete').addEventListener('click', deleteActive);
        document.getElementById('toolSync').addEventListener('click', () => {
          showStatus("📡 数据同步保存中...");
          saveToServer();
        });

        // Fullscreen toggle
        document.getElementById('btnFullscreen').addEventListener('click', toggleFullScreen);

        // Global error handling for developer panel
        window.addEventListener('error', function (e) {
          const log = document.getElementById('devLog');
          if (log) {
            const msg = `[Error] ${e.message} at ${e.filename}:${e.lineno}`;
            log.textContent += msg + '\n';
            log.style.display = 'block';
          }
          console.error(e);
        });
        window.addEventListener('unhandledrejection', function (e) {
          const log = document.getElementById('devLog');
          if (log) {
            const msg = `[Promise Rejection] ${e.reason}`;
            log.textContent += msg + '\n';
            log.style.display = 'block';
          }
          console.error('Unhandled promise rejection:', e.reason);
        });

         // bind move up/down buttons (must be after DOM exists)
         bindMoveButtons();

         document.getElementById('timelineSlider').addEventListener('input', (e) => {
          updateProgress(e.target.value / 1000);
        });

        // Set ScreenSpace Handler for picks and clicks
        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

        // Click detection
        handler.setInputAction((click) => {
          const picked = viewer.scene.pick(click.position);
          if (Cesium.defined(picked) && Cesium.defined(picked.id)) {
            const entity = picked.id;
            if (entity.id && entity.id.startsWith('poi_')) {
              const id = entity.id.replace('poi_', '');
              selectEvent(id);
              return;
            }
          }

          if (addMode) {
            const ray = viewer.camera.getPickRay(click.position);
            let cartesian = viewer.scene.globe.pick(ray, viewer.scene);
            // Fallback to ellipsoid if terrain pick returns undefined
            if (!Cesium.defined(cartesian)) {
              cartesian = viewer.scene.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
            }
            if (Cesium.defined(cartesian)) {
              const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
              const lat = parseFloat(Cesium.Math.toDegrees(cartographic.latitude).toFixed(6));
              const lng = parseFloat(Cesium.Math.toDegrees(cartographic.longitude).toFixed(6));
              
              const id = 'evt_' + Date.now();
              const newPoi = {
                id,
                name: "新节点",
                type: "POI",
                lat,
                lng,
                viewLat: lat,
                viewLng: lng,
                zoom: 1500,
                bubble: "",
                dwell: 8
              };
              data.pois.push(newPoi);
              refreshMarkers();
              refreshEventList();
              selectEvent(id);
              toggleAddMode();
            }
          }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        // Drag-to-move handlers
        handler.setInputAction((click) => {
          const picked = viewer.scene.pick(click.position);
          if (Cesium.defined(picked) && Cesium.defined(picked.id)) {
            const entity = picked.id;
            if (entity.id && entity.id.startsWith('poi_')) {
              const id = entity.id.replace('poi_', '');
              if (id === activeId) {
                isDragging = true;
                dragEntity = entity;
                viewer.scene.screenSpaceCameraController.enableInputs = false; // lock map zoom/rotate
              }
            }
          }
        }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

        handler.setInputAction((movement) => {
          if (isDragging && dragEntity) {
            const ray = viewer.camera.getPickRay(movement.endPosition);
            const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
            if (Cesium.defined(cartesian)) {
              dragEntity.position = cartesian;
              const carto = Cesium.Cartographic.fromCartesian(cartesian);
              const lat = parseFloat(Cesium.Math.toDegrees(carto.latitude).toFixed(6));
              const lng = parseFloat(Cesium.Math.toDegrees(carto.longitude).toFixed(6));

              const id = dragEntity.id.replace('poi_', '');
              const p = data.pois.find(x => x.id === id);
              if (p) {
                p.lat = lat;
                p.lng = lng;
              }
            }
          }
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        handler.setInputAction(() => {
          if (isDragging) {
            isDragging = false;
            dragEntity = null;
            viewer.scene.screenSpaceCameraController.enableInputs = true; // restore map control
            saveToServer();
            refreshMarkers();
          }
        }, Cesium.ScreenSpaceEventType.LEFT_UP);
      } catch (err) {
        console.error("Init failed", err);
      }
    }

    function updateProgress(p) {
      progress = p;
      const pts = data.routes.main;
      if (!pts || pts.length < 2) return;
      
      const idx = Math.floor(p * (pts.length - 1));
      const nextIdx = Math.min(idx + 1, pts.length - 1);
      const t = (p * (pts.length - 1)) - idx;
      
      const a = pts[idx];
      const b = pts[nextIdx];
      const lng = a[0] + (b[0] - a[0]) * t;
      const lat = a[1] + (b[1] - a[1]) * t;
      
      if (pilgrimMarker) {
        pilgrimMarker.position = Cesium.Cartesian3.fromDegrees(lng, lat, 0.0);
      }
      document.getElementById('timeDisplay').textContent = (p * 100).toFixed(1) + '%';
      document.getElementById('timelineSlider').value = p * 1000;
      
      if (playing) {
        // Smoothly look-at current pilgrim position in 3D
          viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(lng, lat, 7500),
            orientation: {
              heading: Cesium.Math.toRadians(0.0),
              pitch: Cesium.Math.toRadians(-25.0),
              roll: 0.0
            }
          });
      }
    }

    // Fullscreen handler
    function toggleFullScreen() {
      const mapDiv = document.getElementById('map');
      if (!document.fullscreenElement) {
        mapDiv.requestFullscreen().catch(err => {
          console.error('Fullscreen request failed:', err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // Adjust Cesium viewer when fullscreen changes
    document.addEventListener('fullscreenchange', () => {
      if (viewer) {
        // Cesium will automatically handle canvas size, but we force a resize to be safe
        viewer.resize();
      }
    });

    function togglePlay() {
      playing = !playing;
      document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
      if (playing) {
        const tick = () => {
          if (!playing) return;
          progress += 0.001;
          if (progress >= 1) { progress = 1; playing = false; document.getElementById('playBtn').textContent = '▶'; }
          updateProgress(progress);
          animationFrameId = requestAnimationFrame(tick);
        };
        animationFrameId = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(animationFrameId);
      }
    }

    function toggleAddMode() {
      addMode = !addMode;
      document.getElementById('toolAddPoi').classList.toggle('active', addMode);
      showStatus(addMode ? "添加模式：点击 3D 山体任意位置添加叙事地标点" : "已退出添加模式");
    }

    function refreshMarkers() {
      Object.keys(markers).forEach(id => {
        viewer.entities.remove(markers[id]);
      });
      markers = {};
      
      data.pois.forEach(poi => {
        const isFlat = !!poi.flat;
        const poiId = String(poi.id).replace('msn_', '');

        const entityConfig = {
          id: 'poi_' + poi.id,
          name: poi.name,
          position: Cesium.Cartesian3.fromDegrees(poi.lng, poi.lat, 0.0)
        };

        const isActive = poi.id === activeId;

        if (isFlat && poiId === 'wht-blank') {
          // Flat/Traditional POI text-label with black outline
          entityConfig.label = {
            text: poi.name + (isActive ? " (已选择)" : ""),
            font: 'bold 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif',
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            fillColor: isActive ? Cesium.Color.fromCssColorString('#f59e0b') : Cesium.Color.fromCssColorString('#ffcd55'),
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 3.5,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: 10000000.0,
            scaleByDistance: new Cesium.NearFarScalar(100, 1.0, 15000, 0.5)
          };
        } else {
          // Standard POI: golden point & offset label
          entityConfig.point = {
            pixelSize: isActive ? 12 : 8,
            color: isActive ? Cesium.Color.fromCssColorString('#f59e0b') : Cesium.Color.fromCssColorString('#ffcd55'),
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: 10000000.0
          };
          entityConfig.label = {
            text: poi.name,
            font: 'bold 12px "PingFang SC", "Microsoft YaHei", sans-serif',
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            fillColor: isActive ? Cesium.Color.fromCssColorString('#f59e0b') : Cesium.Color.fromCssColorString('#e5e7eb'), // Light gray/gold instead of white
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 3.0,
            pixelOffset: new Cesium.Cartesian2(0, -14),
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: 10000000.0,
            scaleByDistance: new Cesium.NearFarScalar(100, 1.0, 15000, 0.5)
          };
        }

        const entity = viewer.entities.add(entityConfig);
        markers[poi.id] = entity;
      });
    }

    function refreshEventList() {
      const list = document.getElementById('eventList');
      list.innerHTML = '';
      
      data.pois.forEach(poi => {
        // Debounce utility to limit rapid clicks
        function debounce(func, wait) {
          let timeout;
          return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
          };
        }

        // Update event list creation to use debounced click
        const item = document.createElement('div');
        item.className = `event-item ${poi.id === activeId ? 'active' : ''}`;
        item.setAttribute('data-poi-id', poi.id);
        item.innerHTML = `
          <div class="event-icon">${poi.type === 'VIEW' ? '🎥' : (poi.flat ? '📄' : '📍')}</div>
          <div class="event-info">
            <div class="event-name">${poi.name}</div>
            <div class="event-meta">${poi.type || 'POI'} · ${poi.bubble ? poi.bubble.replace(/<[^>]*>/g, '').substring(0,12)+'...' : '无内容'}</div>
          </div>
        `;
        item.onclick = debounce(() => selectEvent(poi.id), 150);
        list.appendChild(item);
      });
      document.getElementById('eventCount').textContent = data.pois.length + " 个节点";
    }

    function selectEvent(id) {
      activeId = id;
      const poi = data.pois.find(p => p.id === id);
      if (!poi) return;

      // Update list highlight efficiently (no full rebuild)
      document.querySelectorAll('.event-item').forEach(item => {
        const itemId = item.getAttribute('data-poi-id');
        item.classList.toggle('active', itemId === id);
      });

      // Show and populate the edit form
      document.getElementById('editForm').style.display = 'block';
      document.getElementById('saveBar').style.display = 'flex';
      document.getElementById('fId').value = poi.id || '';
      document.getElementById('fName').value = poi.name || '';
      document.getElementById('fType').value = poi.type || 'POI';
      document.getElementById('fFlat').checked = !!poi.flat;
      document.getElementById('fBubble').value = poi.bubble || '';
      document.getElementById('fImageUrl').value = poi.imageUrl || '';
      document.getElementById('fVideoUrl').value = poi.videoUrl || '';
      document.getElementById('fLat').value = poi.viewLat || poi.lat || '';
      document.getElementById('fLng').value = poi.viewLng || poi.lng || '';
      document.getElementById('fZoom').value = poi.zoom || 2500;
      document.getElementById('fDwell').value = poi.dwell || 8;

      // Camera state fields
      document.getElementById('fCamLng').value = poi.camLng || '';
      document.getElementById('fCamLat').value = poi.camLat || '';
      document.getElementById('fCamHeight').value = poi.camHeight || '';
      document.getElementById('fHeading').value = poi.heading || '';
      document.getElementById('fPitch').value = poi.pitch || '';
      document.getElementById('fRoll').value = poi.roll || '';

      // Update markers to show active state
      refreshMarkers();

      // Fly camera to the selected POI
      if (viewer) {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(poi.lng, poi.lat - 0.015, poi.zoom || 2500),
          orientation: {
            heading: Cesium.Math.toRadians(0.0),
            pitch: Cesium.Math.toRadians(-35.0),
            roll: 0.0
          },
          duration: 1.5
        });
      }
    }

    // Capture current 3D Camera Focus point on terrain
    function captureCamera() {
      if (!activeId) return;
      
      const canvasCenter = new Cesium.Cartesian2(viewer.container.clientWidth / 2, viewer.container.clientHeight / 2);
      const ray = viewer.camera.getPickRay(canvasCenter);
      const targetCartesian = viewer.scene.globe.pick(ray, viewer.scene);
      
      let viewLat, viewLng, range;
      if (Cesium.defined(targetCartesian)) {
        const targetCarto = Cesium.Cartographic.fromCartesian(targetCartesian);
        viewLat = Cesium.Math.toDegrees(targetCarto.latitude);
        viewLng = Cesium.Math.toDegrees(targetCarto.longitude);
        range = Cesium.Cartesian3.distance(viewer.camera.position, targetCartesian);
      } else {
        const cameraCarto = Cesium.Cartographic.fromCartesian(viewer.camera.position);
        viewLat = Cesium.Math.toDegrees(cameraCarto.latitude);
        viewLng = Cesium.Math.toDegrees(cameraCarto.longitude);
        range = cameraCarto.height;
      }

      const cameraCarto = Cesium.Cartographic.fromCartesian(viewer.camera.position);
      const camLng = Cesium.Math.toDegrees(cameraCarto.longitude);
      const camLat = Cesium.Math.toDegrees(cameraCarto.latitude);
      const camHeight = cameraCarto.height;

      const heading = Cesium.Math.toDegrees(viewer.camera.heading);
      const pitch = Cesium.Math.toDegrees(viewer.camera.pitch);
      const roll = Cesium.Math.toDegrees(viewer.camera.roll);

      document.getElementById('fLat').value = viewLat.toFixed(6);
      document.getElementById('fLng').value = viewLng.toFixed(6);
      document.getElementById('fZoom').value = Math.round(range);

      document.getElementById('fCamLng').value = camLng.toFixed(6);
      document.getElementById('fCamLat').value = camLat.toFixed(6);
      document.getElementById('fCamHeight').value = Math.round(camHeight);
      document.getElementById('fHeading').value = heading.toFixed(1);
      document.getElementById('fPitch').value = pitch.toFixed(1);
      document.getElementById('fRoll').value = roll.toFixed(1);

      showStatus("📸 3D相机视角参数已成功捕获 (对焦高度: " + Math.round(range) + " 米)");
    }

    function saveActive() {
      // Snapshot before modifying
      previousPois = JSON.parse(JSON.stringify(data.pois));
      const poi = data.pois.find(p => p.id === activeId);
      if (!poi) return;

      const newId = document.getElementById('fId').value.trim();
      if (newId && newId !== poi.id) {
        poi.id = newId;
        activeId = newId;
      }

      poi.name = document.getElementById('fName').value.trim();
      poi.type = document.getElementById('fType').value;
      
      if (document.getElementById('fFlat').checked) {
        poi.flat = true;
      } else {
        delete poi.flat;
      }

      poi.bubble = document.getElementById('fBubble').value;
      poi.imageUrl = document.getElementById('fImageUrl').value.trim();
      if (!poi.imageUrl) delete poi.imageUrl;
      poi.videoUrl = document.getElementById('fVideoUrl').value.trim();
      if (!poi.videoUrl) delete poi.videoUrl;
      
      poi.viewLat = parseFloat(document.getElementById('fLat').value);
      poi.viewLng = parseFloat(document.getElementById('fLng').value);
      poi.zoom = parseFloat(document.getElementById('fZoom').value);
      poi.dwell = parseInt(document.getElementById('fDwell').value) || 8;

      const camLngVal = parseFloat(document.getElementById('fCamLng').value);
      const camLatVal = parseFloat(document.getElementById('fCamLat').value);
      const camHeightVal = parseFloat(document.getElementById('fCamHeight').value);
      const headingVal = parseFloat(document.getElementById('fHeading').value);
      const pitchVal = parseFloat(document.getElementById('fPitch').value);
      const rollVal = parseFloat(document.getElementById('fRoll').value);

      if (!isNaN(camLngVal)) poi.camLng = camLngVal; else delete poi.camLng;
      if (!isNaN(camLatVal)) poi.camLat = camLatVal; else delete poi.camLat;
      if (!isNaN(camHeightVal)) poi.camHeight = camHeightVal; else delete poi.camHeight;
      if (!isNaN(headingVal)) poi.heading = headingVal; else delete poi.heading;
      if (!isNaN(pitchVal)) poi.pitch = pitchVal; else delete poi.pitch;
      if (!isNaN(rollVal)) poi.roll = rollVal; else delete poi.roll;

      showStatus("✅ 属性已保存到内存，同步中...");
      refreshMarkers();
      refreshEventList();
      saveToServer();
    }

    // Undo last edit
    function undoLastEdit() {
      if (!previousPois) {
        showStatus("⚠️ 没有可撤销的更改");
        return;
      }
      data.pois = previousPois;
      previousPois = null;
      activeId = null;
      document.getElementById('editForm').style.display = 'none';
      document.getElementById('saveBar').style.display = 'none';
      refreshMarkers();
      refreshEventList();
      showStatus("🔄 已撤销上一次编辑");
      saveToServer();
    }

      function deleteActive() {
        if (!activeId) return;
        if (!confirm("确认删除此叙事节点吗？")) return;
        
        // Remove from data.pois
        data.pois = data.pois.filter(p => p.id !== activeId);
        activeId = null;
        document.getElementById('editForm').style.display = 'none';
        document.getElementById('saveBar').style.display = 'none';
        refreshMarkers();
        refreshEventList();
        showStatus("🗑 已删除节点");
        saveToServer();
      }

      // Move selected node up or down in the list
      function moveNode(direction) {
        if (!activeId) {
          showStatus("⚠️ 未选中节点");
          return;
        }
        const idx = data.pois.findIndex(p => p.id === activeId);
        if (idx === -1) return;
        const newIdx = idx + direction;
        if (newIdx < 0 || newIdx >= data.pois.length) {
          showStatus("⚠️ 已达列表边界");
          return;
        }
        // Swap entries
        const temp = data.pois[idx];
        data.pois[idx] = data.pois[newIdx];
        data.pois[newIdx] = temp;
        // Keep activeId unchanged (still points to same POI)
        refreshMarkers();
        refreshEventList();
        // Reselect to keep UI highlight
        selectEvent(activeId);
        showStatus(direction === -1 ? "⬆ 已上移节点" : "⬇ 已下移节点");
        saveToServer();
      }

      // Bind move buttons after init
      function bindMoveButtons() {
        document.getElementById('btnMoveUp').addEventListener('click', () => moveNode(-1));
        document.getElementById('btnMoveDown').addEventListener('click', () => moveNode(1));
      }

    async function saveToServer() {
      try {
        await fetch('api/save-pois', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data.pois, null, 2)
        });
        
        if (typeof BroadcastChannel !== 'undefined') {
          new BroadcastChannel('kailash-kora-data').postMessage({ type: 'data-updated', source: 'narrative-editor' });
        }
        showStatus("✅ 已保存到服务器 & 推送 GitHub");
        pollGitStatus();
      } catch (e) {
        console.error("Save failed", e);
        showStatus("⚠️ 服务端保存失败，请点击 [导出 JSON] 手动备份");
      }
    }

    // Poll Git Status
    let gitPollTimer = null;
    function pollGitStatus() {
      if (gitPollTimer) clearInterval(gitPollTimer);
      let attempts = 0;
      gitPollTimer = setInterval(async () => {
        attempts++;
        try {
          const r = await fetch("api/git-status");
          const s = await r.json();
          if (s.status === "success") {
            showStatus("🚀 已自动部署推送至 GitHub 仓库！");
            clearInterval(gitPollTimer);
          } else if (s.status === "error") {
            showStatus("⚠️ Git 推送失败: " + s.message);
            clearInterval(gitPollTimer);
          }
        } catch(e) {}
        if (attempts > 30) clearInterval(gitPollTimer);
      }, 1000);
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(data.pois, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'pois.json'; a.click();
    }

    function showStatus(msg) {
        const basePath = (() => {
          const path = window.location.pathname;
          const segments = path.split('/').filter(s => s.length > 0);
          // Remove file name (e.g., narrative-editor.html)
          segments.pop();
          return segments.length ? '/' + segments.join('/') + '/' : '';
        })();
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 2500);
    }

    init();
  </script>
</body>
