<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澜沧江河谷如美镇，从竹卡到芒康山巅 - 横断探秘</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --accent-cyan: #00ffaa;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Dynamic Cinematic Ambient Background Gradients */
        .ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        .glow-orb-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 170, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            top: -200px;
            right: -100px;
            animation: float 20s infinite alternate ease-in-out;
        }
        .glow-orb-2 {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -300px;
            left: -200px;
            animation: float 25s infinite alternate-reverse ease-in-out;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }
        /* Glassmorphic Landing Card */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 680px;
            padding: 50px 40px;
            border-radius: 24px;
            background: rgba(17, 24, 39, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .logo-lungta {
            width: 80px;
            height: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 15px rgba(0, 255, 170, 0.4));
            animation: pulseLogo 3s infinite ease-in-out;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 255, 170, 0.3)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(0, 255, 170, 0.6)); }
        }
        .tagline {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 30%, #e2e8f0 70%, rgba(0, 255, 170, 0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        .desc {
            font-size: 16px;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        /* Dynamic Glow Button */
        .btn-launch {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 44px;
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, #00ffd5 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(0, 255, 170, 0.25), 0 0 0 1px rgba(0, 255, 170, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-launch::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: all 0.6s ease;
        }
        .btn-launch:hover {
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 255, 170, 0.45), 0 0 15px rgba(0, 255, 170, 0.3);
        }
        .btn-launch:hover::before {
            left: 100%;
        }
        .btn-launch:active {
            transform: scale(0.98) translateY(1px);
        }
        /* Footer meta info */
        .footer-meta {
            position: absolute;
            bottom: 24px;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            z-index: 5;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
    </div>
    
    <div class="card">
        <img src="assets/logo-lungta-trans.png" class="logo-lungta" alt="风马旗">
        <div class="tagline">三江并流核心区 · 横断探秘</div>
        <h1>澜沧江河谷如美镇<br>从竹卡到芒康山巅</h1>
        <p class="desc">穿越神秘横断山，俯冲大竹卡渡口，领略澜沧江天险峡谷。开启沉浸式 3D 飞行巡航探索之旅。</p>
        <a href="3d/index.html" class="btn-launch">▶ 开启巡航</a>
    </div>

    <div class="footer-meta">
        © 2026 飞越318最美国道. All rights reserved.
    </div>
</body>
</html>
